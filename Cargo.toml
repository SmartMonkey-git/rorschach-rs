[package]
authors = ["Rouven Reuter <Rouven.Reuter@proton.me>"]
description = "A template for rust projects build by the robinson group"
edition = "2024"
homepage = "https://robinsongroup.github.io/"
license = "MIT"
name = "rorschach-rs"
version = "0.1.0"

[dependencies]
thiserror = "2.0.18"
maplit = "1.0.2"
chrono = { version = "0.4.41", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.23.1", features = ["v4"] }
csv = "1.3"
figment = { version = "0.10.19", optional = true, features = ["yaml"] }
serde = { version = "1.0.229", optional = true }
serde_derive = { version = "1.0.229", optional = true }

[features]
config = ["dep:figment", "dep:serde", "dep:serde_derive"]

[dev-dependencies]
ontology-registry = "0.4.2"
ontolius = "0.7.4"