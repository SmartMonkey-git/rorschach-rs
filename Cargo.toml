[package]
authors = ["Rouven Reuter"]
description = "A template for rust projects build by the robinson group"
edition = "2024"
homepage = "https://robinsongroup.github.io/"
license = "MIT"
name = "robinson-group-rust-template"
version = "0.1.0"

[dependencies]
thiserror = "2.0.18"
maplit = "1.0.2"
chrono = { version = "0.4.41", features = ["serde"] }


[dev-dependencies]
polars = "0.53.0"
serde = { version = "1.0.228", features = ["derive"] }
csv = "1.3"